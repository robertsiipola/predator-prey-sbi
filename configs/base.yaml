# Base configuration for predator-prey simulation

data_path: data/LynxHare.txt

params:
  alpha: 1.5
  beta: 0.9
  delta: 0.75
  gamma: 1.3

noise_scale: 0.1
# Solver max step size in years

dt: 0.1

# Use the first observed values as initial conditions
use_observed_initial: true

# Only used if use_observed_initial is false
x0:
  - 10.0
  - 10.0

plot:
  show_observed: true

output_dir: runs

inference:
  num_simulations: 2000
  num_samples: 300
  num_workers: 1
  seed: 0
  noise_scale: 0.0
  sample_with: rejection
  mcmc_method: slice_np
  parameter_order:
    - alpha
    - beta
    - delta
    - gamma
    - hare0
    - lynx0
  prior:
    alpha: [0.2, 3.0]
    beta: [0.05, 1.5]
    delta: [0.05, 1.5]
    gamma: [0.2, 3.0]
    hare0: [1.0, 200.0]
    lynx0: [1.0, 100.0]

diagnostics:
  posterior_draws: 300
  seed: 0
  noise_scale: 0.0
  sbc:
    num_simulations: 500
    num_datasets: 20
    num_posterior_samples: 200
    num_workers: 1
    seed: 0
    sample_with: rejection
    mcmc_method: slice_np
