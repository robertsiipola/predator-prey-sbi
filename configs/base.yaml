# Base configuration for predator-prey simulation

data_path: data/LynxHare.txt

params:
  alpha: 1.5
  beta: 0.9
  delta: 0.75
  gamma: 1.3

noise_scale: 0.1
# Solver max step size in years

dt: 0.1

# How to map latent continuous-time state to annual observations.
# Options: point, midpoint, annual_mean
observation_operator: annual_mean
observation_substeps: 10

# Use the first observed values as initial conditions
use_observed_initial: true

# Only used if use_observed_initial is false
x0:
  - 10.0
  - 10.0

plot:
  show_observed: true

output_dir: runs

inference:
  num_simulations: 2000
  num_samples: 300
  num_workers: 1
  seed: 0
  noise_scale: 0.0
  process_noise_scale: 0.0
  sample_with: rejection
  mcmc_method: slice_np
  prior_scheme: structure_aware
  k_parameterization: k_ratio
  include_process_noise: true
  feature_mode: embedding
  embedding:
    model: nsf
    z_score_x: structured
    hidden_features: 64
    num_transforms: 5
    num_bins: 10
    in_channels: 4
    hidden_channels: 16
    embedding_dim: 32
    kernel_size: 5
  parameter_order:
    - log_T
    - log_r
    - log_x_eq
    - log_y_eq
    - log_k_ratio
    - log_sigma_p
    - eps_h0
    - eps_l0
    - log_sigma_h
    - log_sigma_l
  prior:
    log_T: [2.0794415416798357, 2.6390573296152584]
    log_r: [-0.35667494393873245, 0.3364722366212129]
    log_x_eq: [3.202014467792789, 4.182843720804516]
    log_y_eq: [2.8766108426461274, 3.857440095657854]
    log_k_ratio: [0.6931471805599453, 3.4011973816621555]
    log_sigma_p: [-6.907755278982137, -1.2039728043259361]
    eps_h0: [-0.15, 0.15]
    eps_l0: [-0.15, 0.15]
    log_sigma_h: [-2.995732273553991, -1.2039728043259361]
    log_sigma_l: [-2.995732273553991, -1.2039728043259361]

diagnostics:
  posterior_draws: 300
  seed: 0
  noise_scale: 0.0
  process_noise_scale: 0.0
  sbc:
    num_simulations: 500
    num_datasets: 20
    num_posterior_samples: 200
    num_workers: 1
    seed: 0
    sample_with: rejection
    mcmc_method: slice_np
