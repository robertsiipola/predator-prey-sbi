# Base configuration for predator-prey simulation

data_path: data/LynxHare.txt

params:
  alpha: 1.5
  beta: 0.9
  delta: 0.75
  gamma: 1.3

noise_scale: 0.1
# Solver max step size in years

dt: 0.1

# Use the first observed values as initial conditions
use_observed_initial: true

# Only used if use_observed_initial is false
x0:
  - 10.0
  - 10.0

plot:
  show_observed: true

output_dir: runs

inference:
  num_simulations: 2000
  num_samples: 300
  num_workers: 1
  seed: 0
  noise_scale: 0.0
  sample_with: rejection
  mcmc_method: slice_np
  feature_mode: embedding
  embedding:
    model: nsf
    z_score_x: structured
    hidden_features: 64
    num_transforms: 5
    num_bins: 10
    in_channels: 4
    hidden_channels: 16
    embedding_dim: 32
    kernel_size: 5
  parameter_order:
    - alpha
    - gamma
    - x_star
    - y_star
    - k
    - sigma_h
    - sigma_l
    - eps_h0
    - eps_l0
  prior:
    alpha: [0.2, 3.0]
    gamma: [0.2, 3.0]
    x_star: [5.0, 200.0]
    y_star: [2.0, 100.0]
    k: [150.0, 2000.0]
    sigma_h: [0.05, 0.8]
    sigma_l: [0.05, 0.8]
    eps_h0: [-0.3, 0.3]
    eps_l0: [-0.3, 0.3]

diagnostics:
  posterior_draws: 300
  seed: 0
  noise_scale: 0.0
  sbc:
    num_simulations: 500
    num_datasets: 20
    num_posterior_samples: 200
    num_workers: 1
    seed: 0
    sample_with: rejection
    mcmc_method: slice_np
