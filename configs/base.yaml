# Base configuration for predator-prey simulation

data_path: data/LynxHare.txt

params:
  alpha: 1.5
  beta: 0.9
  delta: 0.75
  gamma: 1.3

noise_scale: 0.1
# Solver max step size in years

dt: 0.1

# Use the first observed values as initial conditions
use_observed_initial: true

# Only used if use_observed_initial is false
x0:
  - 10.0
  - 10.0

plot:
  show_observed: true

output_dir: runs

inference:
  num_simulations: 500
  num_samples: 500
  num_workers: 1
  seed: 0
  noise_scale: 0.0
  prior:
    alpha: [0.2, 3.0]
    beta: [0.05, 1.5]
    delta: [0.05, 1.5]
    gamma: [0.2, 3.0]

diagnostics:
  posterior_draws: 200
  seed: 0
  noise_scale: 0.0
  sbc:
    num_simulations: 500
    num_datasets: 20
    num_posterior_samples: 200
    num_workers: 1
    seed: 0
